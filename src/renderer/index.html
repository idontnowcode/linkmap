<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- object-src(embed/object)·img-src에 blob: 허용 필요 — 파일 미리보기(PDF/이미지)가
         URL.createObjectURL()의 blob: URL을 쓰는데 'self'만으로는 CSP가 조용히 막아버려
         PDF 뷰어가 빈 화면으로 보이던 버그(2026-09-16)의 원인이었다. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'self' blob:"
    />
    <title>LinkMap</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
